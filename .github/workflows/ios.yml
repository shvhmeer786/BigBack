# Builds and tests the iOS app on GitHub's macOS runners, so every push is compile-checked without a local Mac.
name: iOS

on:
  push:
    paths: ["ios/**", ".github/workflows/ios.yml"]
  pull_request:
    paths: ["ios/**", ".github/workflows/ios.yml"]
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  build-and-test:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Use the newest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show toolchain
        run: xcodebuild -version && swift --version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Pick an iPhone simulator
        id: sim
        run: |
          udid=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          for runtime in sorted(devices, reverse=True):
              if ".iOS-" not in runtime:
                  continue
              for d in devices[runtime]:
                  if d["name"].startswith("iPhone"):
                      print(d["udid"]); sys.exit(0)
          sys.exit("no iPhone simulator found")
          ')
          echo "udid=$udid" >> "$GITHUB_OUTPUT"

      - name: Test BigBackKit (validation rules)
        working-directory: ios/Packages/BigBackKit
        run: |
          set +e
          xcodebuild test \
            -scheme BigBackKit-Package \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -skipMacroValidation > test.log 2>&1
          status=$?
          # Summary only: the test run line, any failed test and any compiler error.
          grep -E "Test run with|✘|failed|error:" test.log || tail -n 40 test.log
          exit $status

      - name: Build the app
        working-directory: ios
        run: |
          xcodegen generate
          xcodebuild build \
            -project BigBack.xcodeproj \
            -scheme BigBack \
            -destination "generic/platform=iOS Simulator" \
            -skipMacroValidation -quiet \
            CODE_SIGNING_ALLOWED=NO
